name: ACP Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pypdf
      - name: Collect ACP notices
        run: python scripts/collect_acp.py
      - name: Index a limited batch of PDF text (no AI)\n        run: python scripts/index_pdfs.py\n      - name: Save changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update ACP notices'
            git push
          fi
